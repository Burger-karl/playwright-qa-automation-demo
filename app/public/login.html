<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Demo Ops Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <div class="card">
      <h1>Sign in</h1>
      <p class="muted">Demo Ops Portal</p>

      <div id="form-error" class="alert alert-error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const formError = document.getElementById('form-error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.textContent = '';

      const email = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) {
        formError.textContent = 'Email and password are required.';
        return;
      }

      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      const { ok, data } = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
      });
      button.disabled = false;

      if (!ok) {
        formError.textContent = data.error || 'Sign-in failed. Please try again.';
        return;
      }
      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
